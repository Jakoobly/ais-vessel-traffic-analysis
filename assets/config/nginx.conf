upstream shinyservice {
    server shiny:3838;
}

server {
    listen 80;
    server_name localhost;

    # Static dashboard from Task 6, e.g. /sample_points.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Redirect /ais_app -> /ais_app/ while preserving host + port
    location = /ais_app {
        return 301 $scheme://$http_host/ais_app/;
    }

    # Task 7 Shiny app endpoint
    location /ais_app/ {
        proxy_pass http://shinyservice/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 20d;
        proxy_buffering off;
    }
}