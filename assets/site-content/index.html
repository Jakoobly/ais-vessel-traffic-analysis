<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>THAS 2026 Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      background: white;
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 700px;
      width: 90%;
    }

    h1 {
      margin-bottom: 10px;
      color: #222;
    }

    p {
      color: #666;
      margin-bottom: 40px;
    }

    .button-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav-button {
      text-decoration: none;
      background: #2563eb;
      color: white;
      padding: 20px 30px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      min-width: 240px;
      transition: 0.2s ease;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    .nav-button:hover {
      transform: translateY(-3px);
    }

    .secondary {
      background: #16a34a;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>THAS 2026 AIS Dashboard</h1>
    <p>
      Interactive visualizations for AIS vessel data analysis.
    </p>

    <div class="button-container">
      <a class="nav-button" href="/sample_points.html">
        📍 Sample Points Map
      </a>

      <a class="nav-button secondary" href="/ais_app/">
        🚢 AIS Traffic Density App
      </a>
    </div>
  </div>
</body>
</html>
