version: "3.8"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: ais_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./assets/site-content:/usr/share/nginx/html:ro
      - ./assets/config:/etc/nginx/conf.d:ro
    depends_on:
      - shiny

  shiny:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ais_shiny
    restart: unless-stopped
    expose:
      - "3838"
    volumes:
      # Task 7 requirement: local changes in /shiny are visible inside the container.
      - ./shiny:/srv/shiny-server:ro
      # The app reads preprocessed data; it does not query the API interactively.
      - ./01_data:/home/shiny-data:ro
      - ./assets/logs:/var/log/shiny-server:rw
